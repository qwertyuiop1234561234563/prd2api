server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: prd2api
  profiles:
    active: dev
  servlet:
    multipart:
      # 放宽到 60MB，实际单文件上限由套餐额度在业务层校验
      max-file-size: 60MB
      max-request-size: 60MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:prd2api}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PWD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: prd2api-hikari
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:}
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  cloud:
    refresh:
      enabled: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.dbappsecurity.prd2api.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

prd2api:
  storage:
    mode: ${STORAGE_MODE:local}
    local-path: ${UPLOAD_PATH:./data/upload}
    oss-endpoint: ${OSS_ENDPOINT:}
    oss-access-key: ${OSS_AK:}
    oss-secret-key: ${OSS_SK:}
    oss-bucket: ${OSS_BUCKET:}
  chunk:
    strategy: semantic
    fixed-size: 800
    overlap: 150
    max-llm-chars: 60000
    max-cache-chars: 200000
  rag:
    enable: true
    chroma-url: ${CHROMA_URL:http://127.0.0.1:8000}
    chroma-tenant: default_tenant
    chroma-database: default_database
    collection-prefix: prd2api
    top-k: 4
  llm:
    base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${LLM_API_KEY:}
    model-name: ${LLM_MODEL_NAME:glm-5.3-flash}
    embedding-model: ${LLM_EMBEDDING_MODEL:embedding-3}
    # 允许模型发起工具调用；若所选模型不支持可设为 false
    tool-calling: ${LLM_TOOL_CALLING:true}
    # 推理型模型（如 GLM-5.3-Flash）会先输出 reasoning_content，长文档单阶段实测可达 2~4 分钟，
    # 读超时需显著大于单阶段耗时，否则会在正常生成中途被切断
    connect-timeout: ${LLM_CONNECT_TIMEOUT_MS:30000}
    read-timeout: ${LLM_READ_TIMEOUT_MS:300000}
    max-retry: ${LLM_MAX_RETRY:2}
    retry-backoff-ms: ${LLM_RETRY_BACKOFF_MS:800}
    temperature: 0.2
  limit:
    upload-per-minute: 20
    llm-per-minute: 60
  sensitive:
    enable: true
    words: 身份证号,银行卡号,密码,密钥,secret,password
  security:
    # 是否强制要求 X-Tenant-Id / X-User-Key（生产建议 true）
    require-identity: ${REQUIRE_IDENTITY:false}
    # 是否强制要求登录态（Bearer Token），生产建议 true；开启后不再接受 Header 身份透传
    require-login: ${REQUIRE_LOGIN:false}
    # 是否信任 X-Forwarded-For，仅在请求必经可信代理（Nginx/网关）时开启
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
    # 允许的跨域来源，留空表示 *，生产建议填写具体域名
    allowed-origins: []
    # IP 黑名单，命中直接拒绝
    ip-blacklist: []
    # 接口路径黑名单（前缀匹配）
    path-blacklist: []
  clean:
    enable: true
    expire-day: 7
    cron: "0 30 3 * * ?"
  export:
    token-expire-seconds: 300
    dir: ./data/export
  sentinel-log-dir: ./data/logs/csp
  async:
    file-core: 4
    file-max: 8
    file-queue: 200
    llm-core: 3
    llm-max: 6
    llm-queue: 100
    stream-threads: 4
    stream-max-connections: 200
  auth:
    # 登录令牌有效期（秒），每次请求滑动续期
    token-ttl-seconds: ${AUTH_TOKEN_TTL:43200}
    # 连续登录失败上限与锁定时长
    login-fail-limit: 5
    lock-minutes: 15
    # 允许自助注册的租户白名单，其他租户账号只能由管理员创建
    self-register-tenants: ${SELF_REGISTER_TENANTS:default}
  vip:
    # VIP 到期降级与过期兑换码清理，每日 4 点执行
    expire-cron: "0 0 4 * * ?"
  task:
    # 僵死任务回收：进程崩溃/重启遗留的 INIT、PROCESS 任务在无分布式锁时置为 FAIL，用户可重试
    recover-enabled: true
    # 超过该时长未更新进度才判定为中断，需大于单阶段耗时，避免误杀长文档解析
    recover-stale-minutes: 5
    recover-initial-delay-ms: 20000
    recover-interval-ms: 300000
  assistant:
    # 页面小人对话框后端：操作类问题走规则查询，自由问答走大模型，无密钥时回落内置知识库
    enabled: ${ASSISTANT_ENABLED:true}
    # 每人每分钟提问上限
    rate-limit-per-minute: ${ASSISTANT_RATE_LIMIT:20}
    # 多轮上下文消息条数
    history-limit: 6
    # 会话保留天数与清理时间
    session-expire-days: ${ASSISTANT_SESSION_EXPIRE_DAYS:30}
    clean-cron: "0 0 5 * * ?"
    # 同一会话串行执行：并发请求会被快速拒绝，避免历史/检查点/记忆互相覆盖
    chat-lock-enabled: ${ASSISTANT_CHAT_LOCK_ENABLED:true}
    chat-lock-seconds: ${ASSISTANT_CHAT_LOCK_SECONDS:90}
    # 并发舱壁：限制同时在执行的问答轮数，全局保护进程、租户维度隔离噪声邻居
    bulkhead-enabled: ${ASSISTANT_BULKHEAD_ENABLED:true}
    bulkhead-global-limit: ${ASSISTANT_BULKHEAD_GLOBAL_LIMIT:32}
    bulkhead-tenant-limit: ${ASSISTANT_BULKHEAD_TENANT_LIMIT:8}
    # 获取配额等待毫秒数，0 表示立即失败（快速失败，避免排队放大延迟）
    bulkhead-wait-ms: ${ASSISTANT_BULKHEAD_WAIT_MS:0}
  # 桌面助手 Agent：ReAct 循环 + 工具调用 + 长期记忆 + 知识库
  agent:
    enabled: ${AGENT_ENABLED:true}
    # 单轮最多工具调用步数，防止模型无限调用
    max-steps: ${AGENT_MAX_STEPS:6}
    # 注入系统提示词的长期记忆条数
    memory-inject-limit: 5
    # 知识库召回条数
    knowledge-top-k: 3
    # 是否落库工具调用轨迹
    trace-persist: true
    # 同一轮多个工具并行执行（含单工具超时保护）
    parallel-tools: ${AGENT_PARALLEL_TOOLS:true}
    # 单个工具执行超时（毫秒），超时直接返回失败，不拖垮整轮对话
    tool-timeout-ms: ${AGENT_TOOL_TIMEOUT_MS:8000}
    # 只读工具失败重试次数（写/危险工具不重试，避免重复副作用）
    tool-retry: ${AGENT_TOOL_RETRY:1}
    # 危险操作确认票据有效期（秒）
    confirm-ttl-seconds: ${AGENT_CONFIRM_TTL:300}
    # 提示词注入检测：命中后本轮写操作一律人工确认
    injection-guard: ${AGENT_INJECTION_GUARD:true}
    # 工具执行线程池核心线程数
    tool-core: 4
    # Supervisor 并行委派：同一轮多个专家子任务并发执行后统一汇总
    supervisor-parallel: ${AGENT_SUPERVISOR_PARALLEL:true}
    # 单个子 Agent 执行超时（毫秒），超时只标记该专家缺失
    supervisor-timeout-ms: ${AGENT_SUPERVISOR_TIMEOUT_MS:60000}
    # 单个子 Agent 的 token 预算，避免单个专家吃光全局预算
    sub-agent-token-budget: ${AGENT_SUBAGENT_TOKEN_BUDGET:12000}
    # Actor-Critic 答复评审：LLM-as-judge 三维打分，低分触发一次重写
    critic-enabled: ${AGENT_CRITIC_ENABLED:true}
    critic-min-score: ${AGENT_CRITIC_MIN_SCORE:4}
    critic-rewrite: ${AGENT_CRITIC_REWRITE:true}
    # Corrective RAG：检索置信度不足时改写查询并补一跳召回
    corrective-rag: ${AGENT_CORRECTIVE_RAG:true}
    retrieval-min-confidence: ${AGENT_RETRIEVAL_MIN_CONFIDENCE:0.45}
    retrieval-max-hops: ${AGENT_RETRIEVAL_MAX_HOPS:2}
    retrieval-rewrite-limit: ${AGENT_RETRIEVAL_REWRITE_LIMIT:2}
    # 记忆反思：从对话中归纳稳定偏好写入长期记忆
    memory-reflection: ${AGENT_MEMORY_REFLECTION:true}
    memory-reflection-max-facts: ${AGENT_MEMORY_REFLECTION_MAX_FACTS:2}
    # 断点续跑：未完成任务保存检查点，用户说“继续”时恢复并复用已完成步骤
    checkpoint-enabled: ${AGENT_CHECKPOINT_ENABLED:true}
    checkpoint-ttl-seconds: ${AGENT_CHECKPOINT_TTL:1800}
    checkpoint-max-steps: ${AGENT_CHECKPOINT_MAX_STEPS:10}
    # 工具选择经验策略：从历史成功轨迹学习“问法 → 工具”先验
    tool-policy-enabled: ${AGENT_TOOL_POLICY_ENABLED:true}
    tool-policy-min-score: ${AGENT_TOOL_POLICY_MIN_SCORE:0.4}
    tool-policy-max-entries: ${AGENT_TOOL_POLICY_MAX_ENTRIES:200}
    # 失败反思：工具失败后先诊断原因再重试，并把教训写入 Redis
    reflection-enabled: ${AGENT_REFLECTION_ENABLED:true}
    # PII 脱敏：输出、工具结果、会话记录中的手机号/身份证/银行卡/邮箱统一打码
    pii-mask-enabled: ${AGENT_PII_MASK_ENABLED:true}
    # 工具输出契约：伪成功（空检索/缺字段/原始 JSON）自动降级或改写参数重检
    contract-enabled: ${AGENT_CONTRACT_ENABLED:true}
    # 答复溯源：证据在答复中的字符区间与引用覆盖率
    provenance-enabled: ${AGENT_PROVENANCE_ENABLED:true}
    # 轨迹回放：历史只读步骤按原参数重跑，检测行为漂移
    replay-enabled: ${AGENT_REPLAY_ENABLED:true}
    # 失败样本挖掘：失败轨迹沉淀为可重放的回归用例
    failure-mining-enabled: ${AGENT_FAILURE_MINING_ENABLED:true}
    # 用户反馈闭环：点踩自动转回归用例
    feedback-enabled: ${AGENT_FEEDBACK_ENABLED:true}
    # 决策审计：逐轮校验合规规则并给出评分
    audit-enabled: ${AGENT_AUDIT_ENABLED:true}
    # 只读工具结果缓存：短 TTL 内同参数复用结果
    tool-cache-enabled: ${AGENT_TOOL_CACHE_ENABLED:true}
    tool-cache-ttl-seconds: ${AGENT_TOOL_CACHE_TTL:30}
    # 工具入参安全守卫：注入内容、越界数值、非法 ID 执行前直接拒绝
    argument-guard-enabled: ${AGENT_ARGUMENT_GUARD_ENABLED:true}
    # 工具级限流：每用户每分钟单个工具最多执行次数，0 表示关闭
    tool-rate-limit-per-minute: ${AGENT_TOOL_RATE_LIMIT:30}
    # 失败归因诊断：按轨迹聚合失败原因并给出修复建议
    diagnose-enabled: ${AGENT_DIAGNOSE_ENABLED:true}
    # 记忆新鲜度阈值（天），超过视为陈旧记忆
    memory-stale-days: ${AGENT_MEMORY_STALE_DAYS:30}
    # 记忆冲突判定阈值：记忆键相似度下限（超过且取值不同视为矛盾记忆）
    memory-conflict-similarity: ${AGENT_MEMORY_CONFLICT_SIMILARITY:0.3}
    # PII 存量泄漏审计：扫描历史消息/轨迹中的明文个人信息，支持一键修复
    pii-audit-enabled: ${AGENT_PII_AUDIT_ENABLED:true}
    # 工具健康看板：成功率 SLO 下限与 P95 延迟上限，用于跨会话判级
    tool-health-min-success-rate: ${AGENT_TOOL_HEALTH_MIN_SUCCESS_RATE:0.95}
    tool-health-p95-ms: ${AGENT_TOOL_HEALTH_P95_MS:3000}
    # 调用次数低于该值不做判级，避免一两次抖动误报
    tool-health-min-calls: ${AGENT_TOOL_HEALTH_MIN_CALLS:5}
    # 工具调用样例沉淀：从历史成功轨迹挖掘参数格式，生成 few-shot 样例注入提示词
    tool-example-enabled: ${AGENT_TOOL_EXAMPLE_ENABLED:true}
    tool-example-days: ${AGENT_TOOL_EXAMPLE_DAYS:30}
    tool-example-max-per-tool: ${AGENT_TOOL_EXAMPLE_MAX_PER_TOOL:1}
    tool-example-max-total: ${AGENT_TOOL_EXAMPLE_MAX_TOTAL:6}
    tool-example-min-success: ${AGENT_TOOL_EXAMPLE_MIN_SUCCESS:3}
    tool-example-ttl-seconds: ${AGENT_TOOL_EXAMPLE_TTL:600}
    # 会话行为异常检测：中位数 + MAD 稳健离群，失败率/重复率保留绝对阈值兜底
    anomaly-enabled: ${AGENT_ANOMALY_ENABLED:true}
    anomaly-z-threshold: ${AGENT_ANOMALY_Z_THRESHOLD:3.0}
    anomaly-min-sessions: ${AGENT_ANOMALY_MIN_SESSIONS:5}
    # 计划校验：模型产出的计划在执行前检查工具是否存在、是否重复、是否缺少汇总步骤，并自动修复
    plan-validation-enabled: ${AGENT_PLAN_VALIDATION_ENABLED:true}
    # 工具依赖熔断：近期失败率过高的工具快速失败，冷却后进入半开只放行一次探测
    circuit-enabled: ${AGENT_CIRCUIT_ENABLED:true}
    circuit-window-calls: ${AGENT_CIRCUIT_WINDOW_CALLS:20}
    circuit-min-calls: ${AGENT_CIRCUIT_MIN_CALLS:5}
    circuit-failure-rate: ${AGENT_CIRCUIT_FAILURE_RATE:0.6}
    circuit-cooldown-seconds: ${AGENT_CIRCUIT_COOLDOWN_SECONDS:30}
    circuit-cache-ttl-seconds: ${AGENT_CIRCUIT_CACHE_TTL_SECONDS:30}
    # 复杂度自适应模型路由：简单问题走轻模型、复杂问题走强模型，降低平均 token 成本
    route-enabled: ${AGENT_ROUTE_ENABLED:true}
    route-simple-threshold: ${AGENT_ROUTE_SIMPLE_THRESHOLD:35}
    route-complex-threshold: ${AGENT_ROUTE_COMPLEX_THRESHOLD:65}
    route-simple-model: ${AGENT_ROUTE_SIMPLE_MODEL:default}
    route-standard-model: ${AGENT_ROUTE_STANDARD_MODEL:default}
    route-complex-model: ${AGENT_ROUTE_COMPLEX_MODEL:default}
    # 目标漂移自检：执行路径偏离初始目标时注入一次纠偏提示
    goal-drift-enabled: ${AGENT_GOAL_DRIFT_ENABLED:true}
    goal-drift-min-steps: ${AGENT_GOAL_DRIFT_MIN_STEPS:3}
    goal-drift-focus-threshold: ${AGENT_GOAL_DRIFT_FOCUS_THRESHOLD:0.6}
    goal-drift-weak-threshold: ${AGENT_GOAL_DRIFT_WEAK_THRESHOLD:0.35}
    # 系统提示词 A/B 实验：按用户稳定分桶，小流量验证新提示词
    prompt-ab-enabled: ${AGENT_PROMPT_AB_ENABLED:true}
    prompt-ab-experiment: ${AGENT_PROMPT_AB_EXPERIMENT:assistant-system-v2}
    prompt-ab-percent: ${AGENT_PROMPT_AB_PERCENT:50}
    # 只读工具结果一级缓存（JVM 本地）+ 单飞回源，防止热点参数击穿 Redis 与下游
    hot-cache-enabled: ${AGENT_HOT_CACHE_ENABLED:true}
    hot-cache-ttl-seconds: ${AGENT_HOT_CACHE_TTL:5}
    hot-cache-max-entries: ${AGENT_HOT_CACHE_MAX_ENTRIES:5000}
  # 助手知识库：租户级离线文档上传、异步解析切分与向量化
  knowledge:
    max-docs-per-tenant: ${KNOWLEDGE_MAX_DOCS:200}
    max-doc-size-mb: ${KNOWLEDGE_MAX_DOC_SIZE_MB:20}
    max-chunks-per-doc: ${KNOWLEDGE_MAX_CHUNKS:2000}
    embed-batch-size: ${KNOWLEDGE_EMBED_BATCH:16}
    max-local-candidates: ${KNOWLEDGE_LOCAL_CANDIDATES:2000}
    upload-per-minute: ${KNOWLEDGE_UPLOAD_PER_MINUTE:10}
  # 内置管理员：首次启动自动创建账号并开通最高等级 VIP；已存在账号不会覆盖密码
  admin-init:
    enabled: ${ADMIN_INIT_ENABLED:true}
    tenant-id: ${ADMIN_INIT_TENANT:default}
    username: ${ADMIN_INIT_USERNAME:admin}
    password: ${ADMIN_INIT_PASSWORD:}
    # 留空自动取等级最高的可开通套餐（当前为 PRO）
    plan-code: ${ADMIN_INIT_PLAN:}
    # 内置管理员套餐有效天数，0 表示沿用套餐自身天数
    vip-days: ${ADMIN_INIT_VIP_DAYS:3650}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.dbappsecurity.prd2api: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
