# 生产环境：全部参数通过环境变量注入，严禁硬编码密钥
# 日志目录通过环境变量 LOG_DIR 指定（默认 ./data/logs，生产建议 /data/prd2api/logs）
logging:
  level:
    root: WARN
    com.dbappsecurity.prd2api: INFO

prd2api:
  storage:
    mode: ${STORAGE_MODE:oss}
    local-path: /data/prd2api/upload
  security:
    require-identity: true
    # 生产只接受登录令牌，禁止 Header 身份透传（否则任意客户端可伪造 X-User-Role 越权）
    require-login: ${REQUIRE_LOGIN:true}
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
  # 生产不自动创建内置管理员：需显式开启并注入强密码，避免默认口令进入线上
  admin-init:
    enabled: ${ADMIN_INIT_ENABLED:false}
  clean:
    expire-day: 7
  async:
    file-core: 8
    file-max: 16
    llm-core: 6
    llm-max: 12

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        # 生产仅暴露健康检查与 Prometheus 指标，避免 /metrics、/env 等信息泄露
        include: health,prometheus
  endpoint:
    health:
      show-details: never
